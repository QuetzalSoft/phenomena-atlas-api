# Local database and identity provider for development. Tests do not use these: they
# start their own with Testcontainers (tests/global-setup.ts), on the same images.
services:
  database:
    image: postgis/postgis:18-3.6
    # PostGIS only publishes amd64 images. On Apple silicon Docker runs this one emulated.
    platform: linux/amd64
    environment:
      POSTGRES_USER: phenomena
      POSTGRES_PASSWORD: phenomena
      POSTGRES_DB: phenomena_atlas
    # Hides the image's init scripts, which install PostGIS and other extensions in the
    # database on their own. A managed database does not, so the migrations must.
    tmpfs:
      - /docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    volumes:
      # From PostgreSQL 18 the image keeps its data in a versioned directory under this path.
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "phenomena", "-d", "phenomena_atlas"]
      interval: 2s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    # Dev mode keeps Keycloak's data inside the container, and the realm is imported only
    # when it does not exist yet. The file is the source of truth: after changing it, run
    # `docker compose up -d --force-recreate keycloak`. Changes made in the console are lost.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/phenomena-atlas-realm.json:/opt/keycloak/data/import/phenomena-atlas-realm.json:ro
    healthcheck:
      # The image has no curl, so ask the management port through bash.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  database:
